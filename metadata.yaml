name: MNC Overall Report
author:
  - name: Tevin Temu
    organization: Wildlife Dynamics
    email: tevin@wildlifedynamics.com

description: Consolidates Mara North Conservancy weather station observations, logistics, livestock, wildlife incident and sighting events, and patrols from EarthRanger into a single monthly report, producing weather charts, summary tables, wildlife and livestock maps, and patrol coverage and effort, on an interactive dashboard and in a Word report.
theory: "Weather observations are aggregated to daily values per station for seven variables. Logistics, livestock, wildlife incident, and wildlife sighting events are split by type and summarised into tables and maps over the conservancy boundary, grazing zones, and parcels, with elephant and buffalo sightings also classified by herd composition and grouped into 5 herd-size bins. Patrol observations are split into foot, vehicle, and motorbike patrols, converted to trajectory segments with mode-specific speed limits, and mapped on a 1 km coverage grid per mode and overall. Patrol effort is summarised per mode and per ranger (patrols, distance, duration, and speed), and conservancy patrol occupancy is the percentage of the conservancy covered by patrols."
output_comment: "Outputs a 44-widget dashboard with 7 daily weather charts, logistics tables, livestock maps and tables, a wildlife incident map, sightings maps and summaries for elephant, buffalo, rhino, lion, leopard, cheetah, giraffe, and hartebeest (with herd-size maps and charts for elephant and buffalo), a total events chart, and foot, vehicle, motorbike, and overall patrol coverage maps with effort and occupancy tables. Also writes the underlying summary tables (CSV), patrol relocations and coverage grid (GeoParquet), HTML and PNG copies of every map and chart, and a Word report (overall_report.docx)."
